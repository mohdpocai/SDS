<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Pengurusan SDS & Bahan Kimia Estate</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1b5e20;
            --primary-light: #2e7d32;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --danger: #dc2626;
            --warning: #d97706;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        * {
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            padding: 24px;
            line-height: 1.5;
        }

        .app-container {
            max-width: 1250px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 2px solid var(--border);
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            color: var(--primary);
        }

        .card {
            background: var(--card-bg);
            border-radius: 8px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            padding: 20px;
            margin-bottom: 24px;
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 16px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group.half-width {
            grid-column: span 1;
        }

        label {
            font-size: 13px;
            font-weight: 600;
        }

        input, select {
            padding: 9px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 14px;
        }

        input[readonly] {
            background-color: #f1f5f9;
            color: #475569;
            cursor: not-allowed;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
        }

        .btn-primary:hover {
            background-color: var(--primary-light);
        }

        .btn-secondary {
            background-color: #64748b;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
        }

        .controls {
            margin-bottom: 16px;
            display: flex;
            gap: 12px;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .search-input {
            width: 100%;
            max-width: 360px;
            padding: 9px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 14px;
        }

        .table-responsive {
            overflow-x: auto;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: white;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
        }

        th {
            background-color: #f8fafc;
            color: var(--text-muted);
            font-weight: 600;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            text-transform: uppercase;
            font-size: 11px;
        }

        td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
        }

        /* Class Hazchem Badges */
        .badge-class-1 { background: #fee2e2; color: #991b1b; }
        .badge-class-2 { background: #ffedd5; color: #9a3412; }
        .badge-class-3 { background: #fef3c7; color: #92400e; }
        .badge-class-4 { background: #dcfce7; color: #166534; }

        /* Status Expiry Badges */
        .status-active { background: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; }
        .status-warning { background: #fef3c7; color: #b45309; border: 1px solid #fde68a; }
        .status-danger { background: #fee2e2; color: #b91c1c; border: 1px solid #fca5a5; }

        .btn-action {
            display: inline-flex;
            align-items: center;
            padding: 5px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid var(--border);
            background: white;
            color: var(--text-main);
            text-decoration: none;
            gap: 4px;
        }

        .btn-action:hover { background: #f1f5f9; }
        .btn-warning { color: var(--warning); border-color: #fde68a; }
        .btn-warning:hover { background: #fffbeb; }
        .btn-danger { color: var(--danger); border-color: #fca5a5; }
        .btn-danger:hover { background: #fef2f2; }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(2px);
            z-index: 1000;
        }

        .modal-content {
            background: white;
            border-radius: 8px;
            max-width: 850px;
            width: 90%;
            margin: 30px auto;
            padding: 24px;
            box-shadow: var(--shadow-md);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }

        .close-btn {
            font-size: 20px;
            cursor: pointer;
            border: none;
            background: none;
        }

        .tab-group {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .tab-btn {
            padding: 6px 14px;
            font-size: 12px;
            font-weight: 600;
            border: 1px solid var(--border);
            background: #f8fafc;
            border-radius: 4px;
            cursor: pointer;
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        iframe {
            width: 100%;
            height: 430px;
            border: 1px solid var(--border);
            border-radius: 6px;
            margin-top: 8px;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h1>🌿 Sistem Pengurusan SDS & Bahan Kimia</h1>
        <div style="display: flex; align-items: center; gap: 12px;">
            <span style="font-size: 13px; color: var(--text-muted);">🔒 Kawalan Akses Authorized Person</span>
            <button class="btn-action" onclick="changeAdminPin()" style="font-size: 11px;">⚙️ Tukar PIN Admin</button>
        </div>
    </div>

    <!-- Form Input Card -->
    <div class="card">
        <div class="card-title" id="formTitle">🔒 Pendaftaran & Kemaskini SDS (Memerlukan PIN)</div>
        <form id="sdsForm" onsubmit="saveSDS(event)">
            <input type="hidden" id="editIndex" value="-1">

            <div class="form-grid">
                <div class="form-group">
                    <label>Nama & Brand Bahan Kimia</label>
                    <input type="text" id="chemName" placeholder="Cth: Monex / Kenlon 480" required>
                </div>
                <div class="form-group">
                    <label>Kelas Racun / Hazchem</label>
                    <select id="chemClass" required>
                        <option value="CLASS I">CLASS I (Sangat Beracun)</option>
                        <option value="CLASS II" selected>CLASS II (Beracun)</option>
                        <option value="CLASS III">CLASS III (Berbahaya)</option>
                        <option value="CLASS IV">CLASS IV (Lain-lain)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Revision Date</label>
                    <input type="date" id="revDate" onchange="autoCalculateExpiry()" required>
                </div>
                <div class="form-group">
                    <label>Expiry Date (Auto 5 Tahun)</label>
                    <input type="date" id="expDate" readonly required>
                </div>
                <div class="form-group">
                    <label>CAS No. (CAS Registry Number)</label>
                    <input type="text" id="casNumber" placeholder="Cth: 1071-83-6">
                </div>
                
                <div class="form-group half-width">
                    <label>Pautan SDS Bahasa Melayu (BM)</label>
                    <input type="url" id="driveUrlBm" placeholder="https://drive.google.com/file/d/.../view">
                </div>
                <div class="form-group half-width">
                    <label>Pautan SDS Bahasa Inggeris (ENG)</label>
                    <input type="url" id="driveUrlEng" placeholder="https://drive.google.com/file/d/.../view">
                </div>
            </div>
            
            <div class="btn-group">
                <button type="submit" id="btnSubmit" class="btn-primary">🔑 Simpan Rekod (Perlu PIN)</button>
                <button type="button" id="btnCancel" class="btn-secondary" onclick="resetForm()" style="display: none;">Batal Edit</button>
            </div>
        </form>
    </div>

    <!-- Controls -->
    <div class="controls">
        <input type="text" id="searchInput" class="search-input" onkeyup="filterTable()" placeholder="🔍 Cari bahan kimia, status (Luput / Hampir Luput)...">
        
        <!-- Butang Import & Eksport Data -->
        <div style="display: flex; gap: 8px;">
            <button type="button" class="btn-action" onclick="exportData()" style="background: #0284c7; color: white; border: none; padding: 8px 14px; font-weight:600;">📥 Eksport Backup</button>
            <button type="button" class="btn-action" onclick="triggerImport()" style="background: #0d9488; color: white; border: none; padding: 8px 14px; font-weight:600;">📤 Import Data 🔒</button>
            <input type="file" id="importFile" accept=".json" style="display: none;" onchange="importData(event)">
        </div>
    </div>

    <!-- Table -->
    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th>Nama Bahan Kimia</th>
                    <th>Kelas</th>
                    <th>Status SDS</th>
                    <th>Revision Date</th>
                    <th>Expiry Date</th>
                    <th>CAS No.</th>
                    <th>Fail SDS</th>
                    <th style="text-align: right;">Tindakan</th>
                </tr>
            </thead>
            <tbody id="sdsTableBody">
                <!-- Data dimasukkan secara dinamik -->
            </tbody>
        </table>
    </div>
</div>

<!-- Modal Detail -->
<div id="sdsModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="mName" style="font-size: 18px; color: var(--primary);">Butiran SDS</h2>
            <button class="close-btn" onclick="closeModal()">&times;</button>
        </div>
        <p style="font-size: 14px; margin-bottom: 6px;"><strong>Kelas:</strong> <span id="mClass"></span> | <strong>CAS No.:</strong> <span id="mCas"></span></p>
        <p style="font-size: 14px; margin-bottom: 6px;"><strong>Status Expiry:</strong> <span id="mStatus"></span></p>
        <p style="font-size: 14px; margin-bottom: 12px;"><strong>Revision Date:</strong> <span id="mRev"></span> | <strong>Expiry Date:</strong> <span id="mExp"></span></p>
        
        <div style="background: var(--bg); padding: 12px; border-radius: 6px; margin-top: 10px;">
            <div class="tab-group">
                <button class="tab-btn active" id="tabBm" onclick="switchModalPdf('BM')">🇲🇾 Bahasa Melayu</button>
                <button class="tab-btn" id="tabEng" onclick="switchModalPdf('ENG')">🇬🇧 English</button>
            </div>
            <div id="pdfViewerContainer"></div>
        </div>
    </div>
</div>

<script>
    let activeModalItem = null;
    
    // TETAPAN PIN ADMIN (Default PIN: 1234)
    function getAdminPin() {
        return localStorage.getItem('adminPin') || '1234';
    }

    function verifyAuthorizedPerson() {
        const inputPin = prompt("🔑 Pengesahan Authorized Person Required:\nSila masukkan PIN kebenaran untuk meneruskan:");
        if (inputPin === null) return false; // Dibatalkan oleh pengguna
        
        if (inputPin === getAdminPin()) {
            return true;
        } else {
            alert("❌ PIN Salah! Akses ditolak.");
            return false;
        }
    }

    function changeAdminPin() {
        if (verifyAuthorizedPerson()) {
            const newPin = prompt("Masukkan PIN Baru Authorized Person:");
            if (newPin && newPin.trim().length >= 4) {
                localStorage.setItem('adminPin', newPin.trim());
                alert("✅ PIN Admin berjaya dikemaskini!");
            } else if (newPin !== null) {
                alert("❌ PIN mestilah sekurang-kurangnya 4 digit.");
            }
        }
    }

    function autoCalculateExpiry() {
        const revDateInput = document.getElementById('revDate').value;
        if (revDateInput) {
            const revDate = new Date(revDateInput);
            revDate.setFullYear(revDate.getFullYear() + 5);
            
            const year = revDate.getFullYear();
            const month = String(revDate.getMonth() + 1).padStart(2, '0');
            const day = String(revDate.getDate()).padStart(2, '0');
            
            document.getElementById('expDate').value = `${year}-${month}-${day}`;
        }
    }

    function getExpiryStatus(expDateString) {
        if (!expDateString) return { text: 'Tiada Tarikh', class: '' };

        const today = new Date();
        today.setHours(0, 0, 0, 0);
        
        const expDate = new Date(expDateString);
        expDate.setHours(0, 0, 0, 0);

        const diffTime = expDate - today;
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

        if (diffDays < 0) {
            return { text: '🔴 Luput', class: 'status-danger', rawStatus: 'Luput Expired' };
        } else if (diffDays <= 180) {
            return { text: `🟠 Hampir Luput (${diffDays} hari)`, class: 'status-warning', rawStatus: 'Hampir Luput Expiring' };
        } else {
            return { text: '🟢 Aktif', class: 'status-active', rawStatus: 'Aktif Active' };
        }
    }

    function getSDSData() {
        const stored = localStorage.getItem('sdsData');
        return stored ? JSON.parse(stored) : [];
    }

    function formatDriveEmbedUrl(url) {
        if (!url) return null;
        if (url.includes('/view')) {
            return url.replace('/view', '/preview');
        }
        return url;
    }

    function renderTable() {
        const data = getSDSData();
        const tbody = document.getElementById('sdsTableBody');
        tbody.innerHTML = '';

        if (data.length === 0) {
            tbody.innerHTML = `<tr><td colspan="8" style="text-align:center; color: var(--text-muted); padding:24px;">Tiada rekod SDS disimpan.</td></tr>`;
            return;
        }

        data.forEach((item, index) => {
            let badgeClass = 'badge-class-4';
            if (item.chemClass.includes('I') && !item.chemClass.includes('II') && !item.chemClass.includes('III') && !item.chemClass.includes('IV')) badgeClass = 'badge-class-1';
            else if (item.chemClass.includes('II') && !item.chemClass.includes('III')) badgeClass = 'badge-class-2';
            else if (item.chemClass.includes('III')) badgeClass = 'badge-class-3';

            const status = getExpiryStatus(item.expDate);

            const bmBtn = item.driveUrlBm 
                ? `<a class="btn-action" href="${item.driveUrlBm}" target="_blank">📄 BM</a>`
                : `<span style="color: var(--text-muted); font-size: 11px;">-</span>`;

            const engBtn = item.driveUrlEng 
                ? `<a class="btn-action" href="${item.driveUrlEng}" target="_blank">📄 ENG</a>`
                : `<span style="color: var(--text-muted); font-size: 11px;">-</span>`;

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><strong>${item.name}</strong></td>
                <td><span class="badge ${badgeClass}">${item.chemClass}</span></td>
                <td><span class="badge ${status.class}" data-search="${status.rawStatus}">${status.text}</span></td>
                <td>${item.revDate}</td>
                <td>${item.expDate}</td>
                <td>${item.casNumber || '-'}</td>
                <td>
                    <div style="display:flex; gap:4px;">${bmBtn} ${engBtn}</div>
                </td>
                <td style="text-align: right;">
                    <button class="btn-action" onclick="viewSDS(${index})">Detail</button>
                    <button class="btn-action btn-warning" onclick="editSDS(${index})">Edit 🔒</button>
                    <button class="btn-action btn-danger" onclick="deleteSDS(${index})">Hapus 🔒</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    function saveSDS(e) {
        e.preventDefault();
        
        // MESTI masukkan PIN sebelum Rekod Baru/Kemaskini disimpan
        if (!verifyAuthorizedPerson()) return;

        const data = getSDSData();
        const editIndex = parseInt(document.getElementById('editIndex').value);

        const newItem = {
            id: editIndex >= 0 ? data[editIndex].id : Date.now(),
            name: document.getElementById('chemName').value,
            chemClass: document.getElementById('chemClass').value,
            revDate: document.getElementById('revDate').value,
            expDate: document.getElementById('expDate').value,
            casNumber: document.getElementById('casNumber').value || '-',
            driveUrlBm: document.getElementById('driveUrlBm').value || null,
            driveUrlEng: document.getElementById('driveUrlEng').value || null
        };

        if (editIndex >= 0) {
            data[editIndex] = newItem;
            alert('Rekod SDS berjaya dikemaskini!');
        } else {
            data.push(newItem);
            alert('Rekod SDS baru berjaya disimpan!');
        }

        localStorage.setItem('sdsData', JSON.stringify(data));
        resetForm();
        renderTable();
    }

    function editSDS(index) {
        // MESTI masukkan PIN sebelum benarkan edit
        if (!verifyAuthorizedPerson()) return;

        const data = getSDSData();
        const item = data[index];

        document.getElementById('editIndex').value = index;
        document.getElementById('chemName').value = item.name;
        document.getElementById('chemClass').value = item.chemClass;
        document.getElementById('revDate').value = item.revDate;
        document.getElementById('expDate').value = item.expDate;
        document.getElementById('casNumber').value = item.casNumber === '-' ? '' : item.casNumber;
        document.getElementById('driveUrlBm').value = item.driveUrlBm || '';
        document.getElementById('driveUrlEng').value = item.driveUrlEng || '';

        document.getElementById('formTitle').innerText = '✏️ Kemaskini / Edit SDS Bahan Kimia';
        document.getElementById('btnSubmit').innerText = '🔑 Kemaskini Rekod (Perlu PIN)';
        document.getElementById('btnCancel').style.display = 'inline-block';

        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetForm() {
        document.getElementById('sdsForm').reset();
        document.getElementById('editIndex').value = '-1';
        document.getElementById('formTitle').innerText = '🔒 Pendaftaran & Kemaskini SDS (Memerlukan PIN)';
        document.getElementById('btnSubmit').innerText = '🔑 Simpan Rekod (Perlu PIN)';
        document.getElementById('btnCancel').style.display = 'none';
    }

    function deleteSDS(index) {
        // MESTI masukkan PIN sebelum benarkan padam
        if (!verifyAuthorizedPerson()) return;

        if (confirm("Adakah anda pasti mahu memadamkan rekod ini?")) {
            const data = getSDSData();
            data.splice(index, 1);
            localStorage.setItem('sdsData', JSON.stringify(data));
            resetForm();
            renderTable();
        }
    }

    function viewSDS(index) {
        const data = getSDSData();
        activeModalItem = data[index];

        const status = getExpiryStatus(activeModalItem.expDate);

        document.getElementById('mName').innerText = activeModalItem.name;
        document.getElementById('mClass').innerText = activeModalItem.chemClass;
        document.getElementById('mCas').innerText = activeModalItem.casNumber;
        document.getElementById('mStatus').innerHTML = `<span class="badge ${status.class}">${status.text}</span>`;
        document.getElementById('mRev').innerText = activeModalItem.revDate;
        document.getElementById('mExp').innerText = activeModalItem.expDate;

        switchModalPdf('BM');

        document.getElementById('sdsModal').style.display = 'block';
    }

    function switchModalPdf(lang) {
        const container = document.getElementById('pdfViewerContainer');
        const tabBm = document.getElementById('tabBm');
        const tabEng = document.getElementById('tabEng');

        if (lang === 'BM') {
            tabBm.classList.add('active');
            tabEng.classList.remove('active');
            
            if (activeModalItem && activeModalItem.driveUrlBm) {
                container.innerHTML = `<iframe src="${formatDriveEmbedUrl(activeModalItem.driveUrlBm)}"></iframe>`;
            } else {
                container.innerHTML = `<p style="color: var(--text-muted); font-size:13px; margin-top:12px;">Tiada pautan SDS Bahasa Melayu dilampirkan.</p>`;
            }
        } else {
            tabEng.classList.add('active');
            tabBm.classList.remove('active');

            if (activeModalItem && activeModalItem.driveUrlEng) {
                container.innerHTML = `<iframe src="${formatDriveEmbedUrl(activeModalItem.driveUrlEng)}"></iframe>`;
            } else {
                container.innerHTML = `<p style="color: var(--text-muted); font-size:13px; margin-top:12px;">Tiada pautan SDS Bahasa Inggeris dilampirkan.</p>`;
            }
        }
    }

    function closeModal() {
        document.getElementById('sdsModal').style.display = 'none';
        activeModalItem = null;
    }

    function filterTable() {
        const filter = document.getElementById("searchInput").value.toUpperCase();
        const trs = document.getElementById("sdsTableBody").getElementsByTagName("tr");

        for (let i = 0; i < trs.length; i++) {
            const text = trs[i].textContent || trs[i].innerText;
            trs[i].style.display = text.toUpperCase().indexOf(filter) > -1 ? "" : "none";
        }
    }

    function exportData() {
        const data = localStorage.getItem('sdsData');
        if (!data || JSON.parse(data).length === 0) {
            alert("Tiada data SDS untuk dieksport.");
            return;
        }
        const blob = new Blob([data], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `Backup_SDS_Estate_${new Date().toISOString().slice(0,10)}.json`;
        a.click();
        URL.revokeObjectURL(url);
    }

    function triggerImport() {
        if (verifyAuthorizedPerson()) {
            document.getElementById('importFile').click();
        }
    }

    function importData(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const importedData = JSON.parse(e.target.result);
                if (Array.isArray(importedData)) {
                    if (confirm("Adakah anda mahu menggantikan/menambah data sedia ada dengan fail backup ini?")) {
                        localStorage.setItem('sdsData', JSON.stringify(importedData));
                        renderTable();
                        alert("Data SDS berjaya diimport!");
                    }
                } else {
                    alert("Format fail tidak sah.");
                }
            } catch (err) {
                alert("Ralat semasa membaca fail JSON.");
            }
        };
        reader.readAsText(file);
    }

    window.onload = renderTable;
</script>

</body>
</html>
